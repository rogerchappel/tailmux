name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run check
      - name: Run tests and verify discovery
        run: |
          set -o pipefail
          npm test 2>&1 | tee /tmp/tailmux-test-output.log
          grep -E "Running [1-9][0-9]* compiled test files" /tmp/tailmux-test-output.log
          grep -F "CLI scan emits JSON from fixtures" /tmp/tailmux-test-output.log
      - run: npm run smoke
      - run: bash scripts/validate.sh
